databases:
  - name: od-analytics-db
    plan: basic-256mb
    databaseName: email_intel
    user: email_intel

services:
  - name: od-analytics-redis
    type: keyvalue
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - name: od-analytics-backend
    type: web
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: od-analytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: od-analytics-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      # Frontend origin -- set to the deployed frontend's real URL after
      # the static site below is live (avoid "*" in production, see
      # docs/deployment.md).
      - key: CORS_ORIGINS
        value: https://od-analytics-frontend.onrender.com
      # Object storage: local filesystem does NOT work here because the
      # backend and worker are separate containers with no shared disk.
      # Fill these in with a real S3-compatible bucket (AWS S3, Cloudflare
      # R2, etc.) before the first deploy -- see docs/deployment.md.
      - key: STORAGE_USE_LOCAL_FS
        value: "false"
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      # Optional: AI Analyst. Leave unset to run in safe fallback mode.
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false

  - name: od-analytics-worker
    type: worker
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: od-analytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: od-analytics-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: STORAGE_USE_LOCAL_FS
        value: "false"
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

  - name: od-analytics-frontend
    type: web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite bakes this in at build time, so it must point at the backend's
      # real onrender.com URL -- update and trigger a redeploy once the
      # backend service above is live.
      - key: VITE_API_BASE_URL
        value: https://od-analytics-backend.onrender.com/api/v1
