# Zero-cost deployment: Postgres lives outside Render (Neon free tier,
# persistent -- unlike Render's own free Postgres, which auto-deletes after
# 30 days). Everything else runs on Render's free plans:
#
#   - od-analytics-backend: free web service. Celery runs in "eager" mode
#     (CELERY_TASK_ALWAYS_EAGER=true) so ingestion tasks execute inline in
#     the same request instead of being queued to a separate worker --
#     Render's background workers have no free tier ($7/mo minimum), and a
#     worker would need Redis too, which this setup avoids entirely.
#   - od-analytics-frontend: free static site (no spin-down, unlike web
#     services).
#
# Trade-offs of this shape, see docs/render-deploy.md:
#   - Free web services spin down after 15 min idle; the next request pays a
#     ~1 min cold start.
#   - Uploads are processed synchronously in the request (eager mode), so a
#     large CSV upload will block until processing finishes.
#   - Local filesystem storage is ephemeral -- fine here because backend and
#     "worker" are the same process/container, but raw uploaded files won't
#     survive a redeploy or a cold start after the container is recycled.
#     Parsed data already committed to Postgres is unaffected.

services:
  - name: od-analytics-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # Neon connection string, e.g.
      # postgresql://user:pass@ep-xxxx.neon.tech/email_intel?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Never actually contacted -- task_always_eager=True skips the broker
      # entirely, but Celery's constructor still needs a syntactically valid
      # URL.
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      # Update to the real frontend URL after the first deploy if Render
      # assigned a different subdomain (name collision), see
      # docs/render-deploy.md.
      - key: CORS_ORIGINS
        value: https://od-analytics-frontend.onrender.com
      - key: STORAGE_USE_LOCAL_FS
        value: "true"
      - key: LOCAL_STORAGE_PATH
        value: ./data/raw
      # Optional: AI Analyst. Leave LLM_API_KEY unset to run in safe
      # fallback mode (no cost either way -- Groq also has a free tier).
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false

  - name: od-analytics-frontend
    type: web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite bakes this in at build time -- update to the real backend URL
      # after the first deploy if it differs, then trigger a redeploy.
      - key: VITE_API_BASE_URL
        value: https://od-analytics-backend.onrender.com/api/v1
